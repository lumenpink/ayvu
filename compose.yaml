services:
  ayvu:
    build:
      context: .
      dockerfile: Dockerfile
    image: ayvu:latest
    container_name: ayvu-service
    restart: unless-stopped
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - ./assets/characters:/app/assets/characters:ro
