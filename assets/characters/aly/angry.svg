<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 440" width="160" height="440" class="character-aly character-pose-angry">
  <!-- Aly - Traço Autêntico em Nanquim (Referência ~/ref/aly) -->

  <!-- Calça Jeans Índigo (Referência perfil.jpg) -->
  <g class="aly-jeans">
    <!-- Perna esquerda -->
    <path d="M 50 225 L 77 225 L 75 300 L 74 385 L 48 385 L 47 300 Z" fill="#273b50" stroke="#111111" stroke-width="1.8" />
    <!-- Perna direita -->
    <path d="M 83 225 L 110 225 L 113 300 L 112 385 L 86 385 L 85 300 Z" fill="#273b50" stroke="#111111" stroke-width="1.8" />
    <!-- Costuras e vincos do jeans -->
    <line x1="62" y1="230" x2="61" y2="380" stroke="#1d2d3d" stroke-width="1.0" opacity="0.6" />
    <line x1="98" y1="230" x2="99" y2="380" stroke="#1d2d3d" stroke-width="1.0" opacity="0.6" />
    <!-- Dobras na canela sobre o tênis -->
    <path d="M 48 368 Q 61 372 74 368 M 49 377 Q 61 381 73 377" fill="none" stroke="#162330" stroke-width="1.2" />
    <path d="M 86 368 Q 99 372 112 368 M 87 377 Q 99 381 111 377" fill="none" stroke="#162330" stroke-width="1.2" />
    
    
  </g>

  <!-- Tênis Canvas estilo All-Star bege/lona com biqueira de borracha branca -->
  <g class="aly-shoes">
    <!-- Pé esquerdo -->
    <path d="M 46 385 L 68 385 L 72 414 L 74 425 L 44 425 L 44 414 Z" fill="#9b9281" stroke="#111111" stroke-width="1.8" />
    <!-- Biqueira de borracha branca -->
    <path d="M 58 408 C 66 408 73 412 74 425 L 56 425 Z" fill="#f3f4f6" stroke="#111111" stroke-width="1.4" />
    <!-- Sola branca e listra de acabamento -->
    <rect x="43" y="422" width="32" height="6" rx="1" fill="#ffffff" stroke="#111111" stroke-width="1.4" />
    <line x1="43" y1="424" x2="75" y2="424" stroke="#111111" stroke-width="0.8" />
    <!-- Ilhoses e cadarços brancos -->
    <path d="M 48 392 L 56 397 M 49 400 L 58 404 M 50 407 L 59 411" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

    <!-- Pé direito -->
    <path d="M 92 385 L 114 385 L 116 414 L 116 425 L 86 425 L 88 414 Z" fill="#9b9281" stroke="#111111" stroke-width="1.8" />
    <!-- Biqueira de borracha branca -->
    <path d="M 102 408 C 94 408 87 412 86 425 L 104 425 Z" fill="#f3f4f6" stroke="#111111" stroke-width="1.4" />
    <!-- Sola branca e listra de acabamento -->
    <rect x="85" y="422" width="32" height="6" rx="1" fill="#ffffff" stroke="#111111" stroke-width="1.4" />
    <line x1="85" y1="424" x2="117" y2="424" stroke="#111111" stroke-width="0.8" />
    <!-- Ilhoses e cadarços brancos -->
    <path d="M 112 392 L 104 397 M 111 400 L 102 404 M 110 407 L 101 411" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  </g>


  <!-- Cabelos cacheados volumosos castanhos em nanquim (Referência ~/ref/aly) -->
  <g class="aly-hair-curly">
    <!-- Massa posterior dos cachos atrás dos ombros -->
    <path d="M 54 48 C 36 60 30 95 32 135 C 38 145 52 142 54 130 C 48 110 50 85 58 65 Z" fill="#2a1f18" stroke="#111111" stroke-width="1.6" />
    <path d="M 106 48 C 124 60 130 95 128 135 C 122 145 108 142 106 130 C 112 110 110 85 102 65 Z" fill="#2a1f18" stroke="#111111" stroke-width="1.6" />
    <!-- Textura encaracolada lateral inferior -->
    <path d="M 33 115 Q 26 125 34 135 Q 40 142 46 138 Q 42 128 44 120" fill="#221812" stroke="#111111" stroke-width="1.2" />
    <path d="M 127 115 Q 134 125 126 135 Q 120 142 114 138 Q 118 128 116 120" fill="#221812" stroke="#111111" stroke-width="1.2" />
  </g>

  <!-- Pescoço e Base de Pele -->
  <path d="M 71 96 L 89 96 L 91 120 L 69 120 Z" fill="#f5dfcf" stroke="#111111" stroke-width="1.4" />
  <!-- Correntinha dourada delicada -->
  <path d="M 72 106 Q 80 114 88 106" fill="none" stroke="#d4af37" stroke-width="1.0" />

  <!-- Rosto suave e oval arredondado -->
  <g class="aly-face" >
    <path d="M 62 65 C 60 88 66 102 80 102 C 94 102 100 88 98 65 C 98 48 90 38 80 38 C 70 38 62 48 62 65 Z" fill="#f5dfcf" stroke="#111111" stroke-width="1.6" />
    <!-- Argolinhas douradas nas orelhas -->
    <circle cx="61" cy="78" r="2.2" fill="none" stroke="#d4af37" stroke-width="1.0" />
    <circle cx="99" cy="78" r="2.2" fill="none" stroke="#d4af37" stroke-width="1.0" />
    
    <!-- Expressão facial específica da pose -->
    
    <!-- Sobrancelhas franzidas em V marcante de indignação -->
    <path d="M 67 61 L 78 66" fill="none" stroke="#2a1f18" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 93 61 L 82 66" fill="none" stroke="#2a1f18" stroke-width="2.2" stroke-linecap="round" />
    <!-- Vinco de braveza entre as sobrancelhas -->
    <line x1="80" y1="63" x2="80" y2="68" stroke="#111111" stroke-width="1.2" />
    <!-- Olhos semicerrados firmes -->
    <ellipse cx="73" cy="70" rx="3.5" ry="2.5" fill="#ffffff" stroke="#111111" stroke-width="1.2" />
    <circle cx="73" cy="70" r="1.8" fill="#22140c" />
    <ellipse cx="87" cy="70" rx="3.5" ry="2.5" fill="#ffffff" stroke="#111111" stroke-width="1.2" />
    <circle cx="87" cy="70" r="1.8" fill="#22140c" />
    <!-- Nariz tenso -->
    <path d="M 80 69 L 79 78 Q 80 81 83 79" fill="none" stroke="#111111" stroke-width="1.4" />
    <!-- Boca fechada, lábios apertados em linha reta descendente -->
    <path d="M 73 90 L 87 90" stroke="#111111" stroke-width="2.0" stroke-linecap="round" />
    <line x1="73" y1="90" x2="71" y2="92" stroke="#111111" stroke-width="1.2" />
    <line x1="87" y1="90" x2="89" y2="92" stroke="#111111" stroke-width="1.2" />

  </g>

  <!-- Coroa e mechas frontais de cachos definidos com divisão central -->
  <g class="aly-hair-front">
    <!-- Topo e volume superior dos cachos -->
    <path d="M 58 52 C 54 36 68 28 80 28 C 92 28 106 36 102 52 C 96 46 88 44 80 47 C 72 44 64 46 58 52 Z" fill="#2a1f18" stroke="#111111" stroke-width="1.8" />
    <!-- Mechas cacheadas descendo sobre a testa e têmporas -->
    <path d="M 64 48 Q 60 62 66 72 Q 72 65 70 54 Z" fill="#2a1f18" stroke="#111111" stroke-width="1.2" />
    <path d="M 96 48 Q 100 62 94 72 Q 88 65 90 54 Z" fill="#2a1f18" stroke="#111111" stroke-width="1.2" />
    <!-- Cachos espirais em nanquim definidos nas laterais -->
    <path d="M 56 68 C 50 78 48 95 56 108 C 60 98 58 84 62 76" fill="none" stroke="#111111" stroke-width="1.4" />
    <path d="M 104 68 C 110 78 112 95 104 108 C 100 98 102 84 98 76" fill="none" stroke="#111111" stroke-width="1.4" />
    <!-- Hachuras de brilho e textura nos cachos -->
    <path d="M 68 36 Q 74 33 78 37 M 82 37 Q 86 33 92 36" fill="none" stroke="#4a372d" stroke-width="1.0" />
  </g>


  <!-- Jaqueta Esportiva Casual Azul-Acinzentada (Referência perfil.jpg) -->
  <g class="aly-jacket">
    <!-- Corpo da Jaqueta -->
    <path d="M 52 118 L 108 118 L 115 155 L 112 225 L 48 225 L 45 155 Z" fill="#546e82" stroke="#111111" stroke-width="2.0" />
    <!-- Barra inferior canelada da jaqueta -->
    <rect x="48" y="218" width="64" height="8" fill="#435a6b" stroke="#111111" stroke-width="1.4" />
    <!-- Costura horizontal do tórax -->
    <line x1="50" y1="146" x2="110" y2="146" stroke="#111111" stroke-width="1.2" opacity="0.5" />
    <!-- Gola dobrada da jaqueta -->
    <polygon points="68,118 80,128 73,138 62,126" fill="#485e70" stroke="#111111" stroke-width="1.4" />
    <polygon points="92,118 80,128 87,138 98,126" fill="#485e70" stroke="#111111" stroke-width="1.4" />
    <!-- Fita vermelha / cordão de credencial UFSC -->
    <path d="M 75 125 L 75 165 L 79 165 L 79 125 Z" fill="#c0392b" stroke="#111111" stroke-width="0.8" />
    <path d="M 85 125 L 85 165 L 81 165 L 81 125 Z" fill="#c0392b" stroke="#111111" stroke-width="0.8" />
    <!-- Óculos escuros pendurados na gola -->
    <rect x="76" y="132" width="8" height="6" rx="1.5" fill="#1a1a1a" stroke="#111111" stroke-width="1.0" />
    <!-- Zíper central vertical prateado -->
    <line x1="80" y1="136" x2="80" y2="220" stroke="#d1d5db" stroke-width="2.0" />
    <line x1="80" y1="136" x2="80" y2="220" stroke="#111111" stroke-width="0.8" stroke-dasharray="2,2" />
    <!-- Puxador do zíper -->
    <rect x="78.5" y="134" width="3" height="5" rx="1" fill="#e5e7eb" stroke="#111111" stroke-width="0.8" />
    <!-- Bolsos diagonais da jaqueta -->
    <line x1="55" y1="195" x2="68" y2="212" stroke="#111111" stroke-width="1.4" />
    <line x1="105" y1="195" x2="92" y2="212" stroke="#111111" stroke-width="1.4" />
  </g>

  <!-- Braços e Mãos específicas da Pose -->
  
  <g class="aly-arms">
    <!-- Braços cruzados firmes sobre a jaqueta -->
    <path d="M 52 122 L 38 155 L 75 185 L 115 180 L 122 155 L 108 122" fill="none" stroke="#4a6275" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M 52 122 L 38 155 L 75 185 L 115 180 L 122 155 L 108 122" fill="none" stroke="#111111" stroke-width="2.0" stroke-linejoin="round" />
    <!-- Mãos encaixadas por baixo dos braços -->
    <ellipse cx="62" cy="185" rx="5" ry="4" fill="#f5dfcf" stroke="#111111" stroke-width="1.2" />
    <ellipse cx="98" cy="180" rx="5" ry="4" fill="#f5dfcf" stroke="#111111" stroke-width="1.2" />
    <circle cx="109" cy="215" r="5" fill="#f5dfcf" stroke="#111111" stroke-width="1.4" opacity="0.1" />
  </g>


</svg>