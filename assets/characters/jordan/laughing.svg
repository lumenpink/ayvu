<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Jordan Laughing -->
  <path d="M 18 120 L 22 84 Q 50 78 78 84 L 82 120 Z" fill="#2d6a4f" stroke="#111" stroke-width="2.5" />
  <path d="M 42 80 L 50 94 L 58 80 Z" fill="#f4f1de" stroke="#111" stroke-width="1.8" />
  <!-- Head thrown back -->
  <path d="M 44 70 L 44 78 L 56 78 L 56 70 Z" fill="#e0b288" stroke="#111" stroke-width="2" />
  <path d="M 33 40 Q 30 62 40 70 Q 50 74 60 70 Q 70 62 67 40 Z" fill="#f0caa0" stroke="#111" stroke-width="2.5" />
  <path d="M 28 38 C 24 22 34 12 50 12 C 66 12 76 22 72 38 C 68 34 64 24 50 24 C 36 24 32 34 28 38 Z" fill="#583101" stroke="#111" stroke-width="2.5" />
  <!-- Spectacles tilted up -->
  <circle cx="39" cy="42" r="7.5" fill="#ffffff" fill-opacity="0.3" stroke="#111" stroke-width="2" />
  <circle cx="61" cy="42" r="7.5" fill="#ffffff" fill-opacity="0.3" stroke="#111" stroke-width="2" />
  <line x1="46.5" y1="42" x2="53.5" y2="42" stroke="#111" stroke-width="2" />
  <!-- Laughing eyes (crescent arcs ^ ^) -->
  <path d="M 35 42 Q 39 38 43 42" stroke="#111" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 57 42 Q 61 38 65 42" stroke="#111" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <!-- Laugh tears -->
  <circle cx="30" cy="44" r="2" fill="#48cae4" />
  <circle cx="70" cy="44" r="2" fill="#48cae4" />
  <!-- Big laughing mouth -->
  <path d="M 40 56 Q 50 52 60 56 Q 58 70 42 70 Z" fill="#780000" stroke="#111" stroke-width="2" />
  <path d="M 44 62 C 42 72 58 72 56 62 Z" fill="#ff758f" stroke="#111" stroke-width="1.2" />
</svg>