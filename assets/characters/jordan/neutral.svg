  <line x1="29" y1="102" x2="34" y2="107" stroke="#1b4332" stroke-width="1.5" />
  <!-- Neck & Head -->
  <path d="M 44 74 L 44 82 L 56 82 L 56 74 Z" fill="#e0b288" stroke="#111" stroke-width="2" />
  <path d="M 33 46 Q 30 68 40 76 Q 50 80 60 76 Q 70 68 67 46 Z" fill="#f0caa0" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Shaggy Comic Hair -->
  <path d="M 28 44 C 24 28 34 16 50 16 C 66 16 76 28 72 44 C 68 40 64 30 50 30 C 36 30 32 40 28 44 Z" fill="#583101" stroke="#111" stroke-width="2.5" />
  <path d="M 30 42 Q 22 36 32 30" stroke="#111" stroke-width="2" fill="#583101" />
