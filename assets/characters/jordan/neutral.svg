  <path d="M 40 22 Q 44 14 50 20" stroke="#111" stroke-width="1.8" fill="none" />
  <!-- Round Spectacles -->
  <circle cx="39" cy="48" r="7.5" fill="#ffffff" fill-opacity="0.25" stroke="#111" stroke-width="2" />
  <circle cx="61" cy="48" r="7.5" fill="#ffffff" fill-opacity="0.25" stroke="#111" stroke-width="2" />
  <line x1="46.5" y1="48" x2="53.5" y2="48" stroke="#111" stroke-width="2" />
  <!-- Eyes inside glasses -->
  <circle cx="39" cy="48" r="2.5" fill="#111" />
  <circle cx="61" cy="48" r="2.5" fill="#111" />
  <!-- Eyebrows -->
  <path d="M 33 38 Q 39 35 45 37" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 67 38 Q 61 35 55 37" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- Nose & Warm Smile -->
  <path d="M 50 49 L 48 57 L 52 57" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 44 66 Q 50 70 56 66" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>