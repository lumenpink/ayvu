<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Tiki Laughing (Merry eyes and big dog laugh) -->
  <path d="M 22 120 L 26 84 Q 50 78 74 84 L 78 120 Z" fill="#cf4a30" stroke="#111" stroke-width="2.5" />
  <path d="M 28 84 Q 50 92 72 84" stroke="#1d3557" stroke-width="5" fill="none" />
  <circle cx="50" cy="91" r="4.5" fill="#fca311" stroke="#111" stroke-width="1.5" />
  <!-- Bouncing floppy ears -->
  <path d="M 24 36 C 8 38 6 60 16 66 C 24 68 28 54 28 44 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <path d="M 76 36 C 92 38 94 60 84 66 C 76 68 72 54 72 44 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <!-- Head thrown slightly back -->
  <path d="M 26 44 C 24 26 38 18 50 18 C 62 18 76 26 74 44 C 76 62 66 72 50 72 C 34 72 24 62 26 44 Z" fill="#e8c07d" stroke="#111" stroke-width="2.5" />
  <!-- Muzzle -->
  <path d="M 38 54 C 36 46 64 46 62 54 C 62 66 38 66 38 54 Z" fill="#fdf0cd" stroke="#111" stroke-width="2" />
  <path d="M 45 48 Q 50 45 55 48 Q 55 53 50 54 Q 45 53 45 48 Z" fill="#111" />
  <!-- Laughing eyes (crescent arcs ^ ^) -->
  <path d="M 34 36 Q 40 30 44 36" stroke="#111" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 66 36 Q 60 30 56 36" stroke="#111" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <!-- Laugh tears -->
  <circle cx="30" cy="40" r="2" fill="#48cae4" />
  <circle cx="70" cy="40" r="2" fill="#48cae4" />
  <!-- Big laughing mouth with tongue -->
  <path d="M 40 58 Q 50 54 60 58 Q 58 72 42 72 Z" fill="#780000" stroke="#111" stroke-width="2" />
  <path d="M 44 62 C 42 74 58 74 56 62 Z" fill="#ff758f" stroke="#111" stroke-width="1.2" />
</svg>
