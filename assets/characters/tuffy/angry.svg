<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Tiki Angry (Ears pinned back & growling snout) -->
  <path d="M 22 120 L 26 84 Q 50 78 74 84 L 78 120 Z" fill="#cf4a30" stroke="#111" stroke-width="2.5" />
  <path d="M 28 84 Q 50 92 72 84" stroke="#1d3557" stroke-width="5" fill="none" />
  <circle cx="50" cy="91" r="4.5" fill="#fca311" stroke="#111" stroke-width="1.5" />
  <!-- Ears pinned back -->
  <path d="M 26 38 C 10 32 4 48 10 56 C 18 64 24 52 26 44 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <path d="M 74 38 C 90 32 96 48 90 56 C 82 64 76 52 74 44 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <!-- Head & Cheeks -->
  <path d="M 26 48 C 24 30 38 22 50 22 C 62 22 76 30 74 48 C 76 66 66 76 50 76 C 34 76 24 66 26 48 Z" fill="#e8c07d" stroke="#111" stroke-width="2.5" />
  <!-- Muzzle with wrinkles -->
  <path d="M 38 58 C 36 50 64 50 62 58 C 62 70 38 70 38 58 Z" fill="#fdf0cd" stroke="#111" stroke-width="2" />
  <path d="M 45 52 Q 50 49 55 52 Q 55 57 50 58 Q 45 57 45 52 Z" fill="#111" stroke="#111" stroke-width="1" />
  <!-- Snout wrinkles -->
  <path d="M 46 48 Q 50 46 54 48" stroke="#111" stroke-width="1.5" fill="none" />
  <path d="M 47 45 Q 50 43 53 45" stroke="#111" stroke-width="1.5" fill="none" />
  <!-- Furrowed brows -->
  <line x1="33" y1="34" x2="44" y2="40" stroke="#111" stroke-width="2.5" stroke-linecap="round" />
  <line x1="67" y1="34" x2="56" y2="40" stroke="#111" stroke-width="2.5" stroke-linecap="round" />
  <!-- Glaring eyes -->
  <ellipse cx="38" cy="42" rx="3.5" ry="4.5" fill="#111" />
  <ellipse cx="62" cy="42" rx="3.5" ry="4.5" fill="#111" />
  <!-- Growling mouth with sharp canine teeth -->
  <path d="M 42 63 Q 50 60 58 63 Q 56 68 44 68 Z" fill="#780000" stroke="#111" stroke-width="1.8" />
  <polygon points="44,63 46,63 45,66" fill="#ffffff" />
  <polygon points="54,63 56,63 55,66" fill="#ffffff" />
</svg>
