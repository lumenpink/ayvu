  <!-- Drooped ears hanging low -->
  <path d="M 22 46 C 8 54 6 78 16 84 C 24 86 26 70 26 56 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <path d="M 78 46 C 92 54 94 78 84 84 C 76 86 74 70 74 56 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <!-- Head tilted down slightly -->
  <path d="M 26 52 C 24 34 38 26 50 26 C 62 26 76 34 74 52 C 76 70 66 80 50 80 C 34 80 24 70 26 52 Z" fill="#e8c07d" stroke="#111" stroke-width="2.5" />
  <!-- Muzzle / Snout -->
  <path d="M 38 62 C 36 54 64 54 62 62 C 62 74 38 74 38 62 Z" fill="#fdf0cd" stroke="#111" stroke-width="2" />
  <path d="M 45 56 Q 50 53 55 56 Q 55 61 50 62 Q 45 61 45 56 Z" fill="#111" stroke="#111" stroke-width="1" />
  <!-- Sad puppy eyes looking down -->
  <ellipse cx="38" cy="46" rx="4.5" ry="6" fill="#111" />
  <circle cx="39.5" cy="48" r="1.5" fill="#ffffff" />
  <ellipse cx="62" cy="46" rx="4.5" ry="6" fill="#111" />
  <circle cx="63.5" cy="48" r="1.5" fill="#ffffff" />
  <path d="M 33 38 Q 40 42 44 41" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 67 38 Q 60 42 56 41" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- Downturned mouth -->
  <path d="M 44 68 Q 50 63 56 68" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
