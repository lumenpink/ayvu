<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Tiki Sad (Drooped ears & sad puppy eyes) -->
  <path d="M 22 120 L 26 88 Q 50 82 74 88 L 78 120 Z" fill="#cf4a30" stroke="#111" stroke-width="2.5" />
  <path d="M 28 88 Q 50 96 72 88" stroke="#1d3557" stroke-width="5" fill="none" />
