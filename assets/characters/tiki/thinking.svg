<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Tiki Thinking (Paw on snout, eyes looking up) -->
  <path d="M 22 120 L 26 84 Q 50 78 74 84 L 78 120 Z" fill="#cf4a30" stroke="#111" stroke-width="2.5" />
  <path d="M 28 84 Q 50 92 72 84" stroke="#1d3557" stroke-width="5" fill="none" />
  <circle cx="50" cy="91" r="4.5" fill="#fca311" stroke="#111" stroke-width="1.5" />
  <!-- One ear up, one ear drooped -->
  <path d="M 24 32 C 18 16 26 12 32 18 C 36 24 32 36 28 38 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <path d="M 76 38 C 90 44 92 68 82 72 C 74 74 72 58 72 46 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <!-- Head tilted -->
  <path d="M 28 48 C 26 30 40 22 52 22 C 64 22 78 30 76 48 C 78 66 68 76 52 76 C 36 76 26 66 28 48 Z" fill="#e8c07d" stroke="#111" stroke-width="2.5" />
  <!-- Muzzle -->
  <path d="M 40 58 C 38 50 66 50 64 58 C 64 70 40 70 40 58 Z" fill="#fdf0cd" stroke="#111" stroke-width="2" />
  <path d="M 47 52 Q 52 49 57 52 Q 57 57 52 58 Q 47 57 47 52 Z" fill="#111" />
  <!-- Eyes looking up -->
  <ellipse cx="40" cy="38" rx="4.5" ry="5.5" fill="#111" />
  <circle cx="41.5" cy="35.5" r="1.5" fill="#ffffff" />
  <ellipse cx="64" cy="38" rx="4.5" ry="5.5" fill="#111" />
  <circle cx="65.5" cy="35.5" r="1.5" fill="#ffffff" />
  <!-- Paw under chin -->
  <ellipse cx="58" cy="72" rx="7" ry="6" fill="#e8c07d" stroke="#111" stroke-width="2" />
  <line x1="56" y1="68" x2="56" y2="74" stroke="#111" stroke-width="1.2" />
  <line x1="60" y1="68" x2="60" y2="74" stroke="#111" stroke-width="1.2" />
  <!-- Pensive mouth line -->
  <path d="M 46 64 Q 50 66 54 63" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
