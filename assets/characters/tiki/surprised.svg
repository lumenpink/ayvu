  <path d="M 38 58 C 36 50 64 50 62 58 C 62 70 38 70 38 58 Z" fill="#fdf0cd" stroke="#111" stroke-width="2" />
  <path d="M 45 52 Q 50 49 55 52 Q 55 57 50 58 Q 45 57 45 52 Z" fill="#111" stroke="#111" stroke-width="1" />
  <!-- Huge Saucer Eyes with tiny pupils -->
  <circle cx="37" cy="40" r="7" fill="#ffffff" stroke="#111" stroke-width="2" />
  <circle cx="37" cy="40" r="2.5" fill="#111" />
  <circle cx="63" cy="40" r="7" fill="#ffffff" stroke="#111" stroke-width="2" />
  <circle cx="63" cy="40" r="2.5" fill="#111" />
  <!-- 'O' mouth -->
