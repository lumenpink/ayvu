  <!-- Paws up in shock -->
  <ellipse cx="20" cy="80" rx="6" ry="7" fill="#e8c07d" stroke="#111" stroke-width="2" />
  <ellipse cx="80" cy="80" rx="6" ry="7" fill="#e8c07d" stroke="#111" stroke-width="2" />
  <!-- Ears sticking straight UP -->
  <path d="M 32 30 C 24 10 32 4 40 12 C 44 20 40 32 36 34 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
  <path d="M 68 30 C 76 10 68 4 60 12 C 56 20 60 32 64 34 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" />
