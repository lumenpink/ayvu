<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Tiki Neutral (Jim Woodring Dog) -->
  <!-- Body & Collar -->
  <path d="M 22 120 L 26 84 Q 50 78 74 84 L 78 120 Z" fill="#cf4a30" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M 28 84 Q 50 92 72 84" stroke="#1d3557" stroke-width="5" fill="none" />
  <circle cx="50" cy="91" r="4.5" fill="#fca311" stroke="#111" stroke-width="1.5" />
  <!-- Inking hatch on torso -->
  <line x1="28" y1="98" x2="33" y2="103" stroke="#9d2a1b" stroke-width="1.5" />
  <line x1="29" y1="104" x2="34" y2="109" stroke="#9d2a1b" stroke-width="1.5" />
  <!-- Floppy Ears (Left & Right) with organic Woodring curves -->
  <path d="M 24 38 C 10 44 8 68 18 72 C 26 74 28 58 28 46 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M 18 52 Q 16 66 22 68" stroke="#704422" stroke-width="1.5" fill="none" />
  <path d="M 76 38 C 90 44 92 68 82 72 C 74 74 72 58 72 46 Z" fill="#9e6638" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
  <path d="M 82 52 Q 84 66 78 68" stroke="#704422" stroke-width="1.5" fill="none" />
  <!-- Head & Cheeks -->
  <path d="M 26 48 C 24 30 38 22 50 22 C 62 22 76 30 74 48 C 76 66 66 76 50 76 C 34 76 24 66 26 48 Z" fill="#e8c07d" stroke="#111" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Muzzle / Snout -->
  <path d="M 38 58 C 36 50 64 50 62 58 C 62 70 38 70 38 58 Z" fill="#fdf0cd" stroke="#111" stroke-width="2" />
  <!-- Black Nose -->
  <path d="M 45 52 Q 50 49 55 52 Q 55 57 50 58 Q 45 57 45 52 Z" fill="#111" stroke="#111" stroke-width="1" />
  <ellipse cx="48" cy="53" rx="1.5" ry="1" fill="#ffffff" />
  <!-- Eyes -->
  <ellipse cx="38" cy="40" rx="4.5" ry="6" fill="#111" />
  <circle cx="39.5" cy="38.5" r="1.5" fill="#ffffff" />
  <ellipse cx="62" cy="40" rx="4.5" ry="6" fill="#111" />
  <circle cx="63.5" cy="38.5" r="1.5" fill="#ffffff" />
  <path d="M 34 32 Q 40 30 43 33" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M 66 32 Q 60 30 57 33" stroke="#111" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <!-- Cute Dog Mouth -->
  <path d="M 50 58 L 50 63" stroke="#111" stroke-width="2" />
  <path d="M 44 63 Q 50 67 56 63" stroke="#111" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
