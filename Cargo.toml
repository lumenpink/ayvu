[package]
name = "ayvu"
version = "0.1.0-dev.1"
edition = "2021"
authors = ["Lumen Pink <hi@lumen.pink>"]
description = "Declarative comic strip generator inspired by Microsoft Comic Chat"
license = "GPL-3.0-or-later"
homepage = "https://ayvu.2lp.in"
repository = "https://codeberg.org/lumenpink/ayvu"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"

[features]
default = []
wasm = ["wasm-bindgen"]

[dev-dependencies]
tempfile = "3.17"
ureq = "2.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

